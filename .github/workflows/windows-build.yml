name: Test and build Windows Music

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      trimmed_experiment:
        description: 'Build an experimental trimmed artifact only; do not publish a release'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected Windows inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test selective-build decisions
        run: node --test tests/selective-builds.test.mjs
      - name: Compare Windows inputs with the last published package
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && 'windows' || 'none' }}
        run: node scripts/selective-builds.mjs --repository "$GH_REPO" --component windows --force "$FORCE_COMPONENT" --github-output "$GITHUB_OUTPUT"

  core:
    name: Test protocol and persistence
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: apps/windows/global.json
      - name: Run real protocol and SQLite tests
        run: dotnet test Music.Core.Tests/Music.Core.Tests.csproj --configuration Release --logger trx
      - name: Test Windows update source and controls
        run: dotnet test Music.Update.Tests/Music.Update.Tests.csproj --configuration Release --logger trx
      - name: Publish reflection-disabled trimmed persistence and updater checks
        run: dotnet publish Music.TrimChecks/Music.TrimChecks.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishTrimmed=true --output artifacts/trim-checks
      - name: Execute the actual trimmed compatibility checks
        run: ./artifacts/trim-checks/Music.TrimChecks
      - name: Test Familiar sage visual contracts
        run: node --test validation/visual-contracts.test.mjs
      - name: Check runtime XAML source contracts
        run: python3 -m unittest discover -s validation -p 'test_source_contracts.py' -v
      - name: Test request isolation and view policies
        run: dotnet run --project validation/LogicChecks.csproj --configuration Release
      - name: Test installer and guarded release tooling
        run: python3 -m unittest discover -s ../../tests -p 'test_windows_*.py' -v
      - name: Test Windows workflow and smoke-test contracts
        run: node --test ../../tests/windows-installer-smoke.test.mjs ../../tests/windows-release-workflow.test.mjs ../../tests/windows-shared-release.test.mjs ../../tests/windows-branding.test.mjs ../../tests/windows-window-integration.test.mjs ../../tests/windows-package-size.test.mjs ../../tests/windows-trimming.test.mjs

  windows:
    name: Compile and publish native Windows app
    runs-on: windows-2025
    needs: core
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: apps/windows/global.json
      - name: Run tests on Windows
        run: dotnet test Music.Core.Tests/Music.Core.Tests.csproj --configuration Release --logger trx
      - name: Test Windows update source on Windows
        run: dotnet test Music.Update.Tests/Music.Update.Tests.csproj --configuration Release --logger trx
      - name: Derive the Windows version from committed history
        id: version
        run: python ../../scripts/windows-release.py version --github-output "$env:GITHUB_OUTPUT"
      - name: Publish self-contained x64 app
        run: dotnet publish Music.App/Music.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:MusicTrimmed=${{ inputs.trimmed_experiment == true }} -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}+${{ github.sha }} --output artifacts/windows/win-x64
      - name: Retain the Windows build for manual testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-windows-x64-${{ github.sha }}
          path: apps/windows/artifacts/windows/win-x64/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
