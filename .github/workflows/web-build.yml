name: Validate web design studies

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Detect affected web inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test selective-build decisions
        run: node --test tests/selective-builds.test.mjs
      - name: Compare web inputs with the last successful main check
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && 'web' || 'none' }}
        run: node scripts/selective-builds.mjs --repository "$GH_REPO" --component web --force "$FORCE_COMPONENT" --github-output "$GITHUB_OUTPUT"

  web:
    name: Build and test browser design studies
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked test dependencies
        run: npm ci
      - name: Install the pinned Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build and test mockups, not a production web release
        run: npm test
