name: Package and release Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'apps/windows/**'
      - 'scripts/*windows*.py'
      - 'scripts/test-windows-installer.ps1'
      - 'tests/test_windows_*.py'
      - 'tests/windows-*.test.mjs'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish an unsigned Windows prerelease after package verification'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Existing source-contract tests must decode UTF-8 on Windows, not the host code page.
  PYTHONUTF8: '1'

jobs:
  package:
    name: Build and verify Windows installer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the exact source and full version history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restrict publication to main
        if: inputs.publish_preview && github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw 'Windows prerelease publication is only allowed from main.'
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: apps/windows/global.json
      - name: Test Windows workflow and smoke-test contracts
        shell: pwsh
        run: node --test tests/windows-installer-smoke.test.mjs tests/windows-release-workflow.test.mjs
      - name: Build real self-contained payload, installer and integrity manifest
        shell: pwsh
        run: python scripts/build-windows-installer.py --output-directory dist/windows-build --allow-unsigned
      - name: Revalidate the packaged artifacts
        shell: pwsh
        run: python scripts/windows-release.py validate --directory dist/windows-build/releases
      - name: Install, launch and uninstall the packaged Windows app
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -InstallerPath dist/windows-build/releases/MusicWindows-win-x64-Setup.exe -EvidenceDirectory dist/windows-smoke
      - name: Retain Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-windows-smoke-${{ github.sha }}
          path: dist/windows-smoke/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false
      - name: Retain the installer and update packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-windows-installer-${{ github.sha }}
          path: dist/windows-build/releases/*
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  publish:
    name: Publish and read back Windows prerelease
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: music-windows-release-publication
      cancel-in-progress: false
    steps:
      - name: Check out the exact packaged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's verified installer artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: music-windows-installer-${{ github.sha }}
          path: dist/windows-release
          digest-mismatch: error
      - name: Validate, upload, download and verify the Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/windows-release.py publish --directory dist/windows-release --repository "$GH_REPO"
